# ---------------------------------------------------------------------------
# Profile "test" - automated tests only.
#
# There is NO datasource URL, Redis URL or object-storage endpoint here on
# purpose: every integration test gets PostgreSQL, Redis and MinIO (and RabbitMQ
# where needed) from Testcontainers (@ServiceConnection / DynamicPropertyRegistrar,
# see com.opscenter.support), so a test can never touch the developer's services
# on localhost:5433 / 6467 / 9002.
# ---------------------------------------------------------------------------
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Tests need the four DEV accounts of 07-TC §5 as fixtures (D-27) and the demo
    # services of db/seed-demo (odoo-erp ..., D-64).
    locations: classpath:db/migration,classpath:db/seed-dev,classpath:db/seed-demo
  rabbitmq:
    # Only the contexts importing RabbitTestcontainersConfiguration have a broker; their
    # @ServiceConnection overrides this. Everywhere else the address is unroutable on purpose
    # (port 1 = connection refused at once), so nothing ever reaches the developer's
    # RabbitMQ on localhost:5672 and "broker down" is deterministic.
    addresses: amqp://guest:guest@127.0.0.1:1

management:
  health:
    rabbit:
      enabled: false    # only the RabbitMQ contexts have a broker; see RabbitTestcontainersConfiguration

opscenter:
  security:
    jwt:
      secret: test-only-secret-not-for-real-use-0123456789
  outbox:
    relay:
      enabled: false    # tests call OutboxRelay.relayOnce() explicitly
  idempotency:
    purge:
      enabled: false    # tests call IdempotencyKeyStore.purgeExpired() explicitly
  integration:
    alertmanager:
      token: test-only-alertmanager-token-0123456789abcdef
  system:
    probes:
      # No Prometheus/Alertmanager in tests: the probes report UNKNOWN (tests of the HTTP
      # probes use their own in-process stub server).
      prometheus-url: ""
      alertmanager-url: ""

logging:
  level:
    com.opscenter: DEBUG
    org.testcontainers: INFO
    com.github.dockerjava: WARN
